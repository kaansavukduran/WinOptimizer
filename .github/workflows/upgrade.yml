name: Verify installed signed update
on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: Previous published version
        type: string
        default: v5.0.0
      expected_version:
        description: Version expected after in-app upgrade
        type: string
        default: 5.0.1
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BASELINE_TAG: ${{ inputs.baseline_tag }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download and install previous published package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:BASELINE_TAG" --repo kaansavukduran/WinOptimizer --pattern '*-Setup.exe' --dir baseline
          $setup = (Get-ChildItem baseline/*-Setup.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Baseline installation failed' }
      - name: Create real sample data in installed baseline
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\WinOptimizer Aion\WinOptimizer Aion.exe'
          if ($env:BASELINE_TAG -match '^v[6-9]\.') {
            $env:AION_EVIDENCE = Join-Path $pwd 'work/native-evidence/baseline'
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke','seed' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw 'Native baseline seed failed' }
            # Test-only preview channel preference in the runner's own sample data.
            $settings = Join-Path $env:LOCALAPPDATA 'WinOptimizer Aion/settings.json'
            $data = Get-Content $settings -Raw | ConvertFrom-Json
            $data.channel = 'beta'
            $data | ConvertTo-Json -Depth 6 | Set-Content $settings -Encoding utf8NoBOM
          } else { node scripts/windows-smoke.cjs "$exe" seed }
      - name: Use in-app update and verify preserved data
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\WinOptimizer Aion\WinOptimizer Aion.exe'
          if ($env:BASELINE_TAG -match '^v[6-9]\.') {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-native-update.ps1 -Exe "$exe"
            if ($LASTEXITCODE -ne 0) { throw 'Native update UI automation failed' }
            $uiReceipt = Get-Content 'work/native-evidence/native-update-ui/invoked-controls.json' -Raw | ConvertFrom-Json
            $baselineProcessId = $uiReceipt.baselineProcessId
          } else { node scripts/windows-smoke.cjs "$exe" upgrade }
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep -Seconds 3
            $restarted = Get-Process -Name 'WinOptimizer Aion' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 -and $_.Id -ne $baselineProcessId } | Select-Object -First 1
          } while (-not $restarted -and (Get-Date) -lt $deadline)
          if (-not $restarted) { throw 'Application did not restart after update' }
          if (-not $restarted.CloseMainWindow()) { throw 'Could not close restarted app normally' }
          if (-not $restarted.WaitForExit(60000)) { throw 'Restarted app did not close' }
          $env:AION_EVIDENCE = Join-Path $pwd 'work/native-evidence/upgrade'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke','verify' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Native upgrade verification failed' }
          if (-not (Test-Path "$env:AION_EVIDENCE/verified-verify.json")) { throw 'Native upgrade receipt missing' }
          $verified = Get-Content "$env:AION_EVIDENCE/verified-verify.json" -Raw | ConvertFrom-Json
          if ($verified.version -ne $env:EXPECTED_VERSION -or $verified.verified -ne $true) { throw 'Updated native app version mismatch' }
      - name: Verify original activity and milestones after native migration
        shell: pwsh
        run: |
          $data = Join-Path $env:LOCALAPPDATA 'WinOptimizer Aion'
          $activity = Get-Content (Join-Path $data 'activity.json') -Raw | ConvertFrom-Json
          if ($activity.schema -ne 1) { throw 'Activity schema changed unexpectedly' }
          $cleanup = @($activity.events | Where-Object { $_.type -eq 'cleanup' })
          $restore = @($activity.events | Where-Object { $_.type -eq 'restore' })
          if ($cleanup.Count -lt 1 -or $restore.Count -lt 1) { throw 'Baseline activity was lost' }
          if ('health' -notin $activity.milestones -or 'scan' -notin $activity.milestones) { throw 'Milestones were lost' }
          $receipt = @{ baseline=$env:BASELINE_TAG; version=$env:EXPECTED_VERSION; cleanupEvents=$cleanup.Count; restoreEvents=$restore.Count; milestones=$activity.milestones; preserved=$true }
          $receipt | ConvertTo-Json -Depth 6 | Set-Content 'work/native-evidence/upgrade/preserved-history.json' -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-update-evidence
          path: |
            work/native-*.json
            work/screenshots/
            work/native-evidence/
