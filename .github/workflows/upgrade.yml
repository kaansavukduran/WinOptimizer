name: Verify installed signed update
on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: Previous published version
        type: string
        default: v5.0.0
      expected_version:
        description: Version expected after in-app upgrade
        type: string
        default: 5.0.1
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BASELINE_TAG: ${{ inputs.baseline_tag }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download and install previous published package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:BASELINE_TAG" --repo kaansavukduran/WinOptimizer --pattern '*-Setup.exe' --dir baseline
          $setup = (Get-ChildItem baseline/*-Setup.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Baseline installation failed' }
      - name: Create real sample data in installed baseline
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\WinOptimizer Aion\WinOptimizer Aion.exe'
          node scripts/windows-smoke.cjs "$exe" seed
      - name: Use in-app update and verify preserved data
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\WinOptimizer Aion\WinOptimizer Aion.exe'
          node scripts/windows-smoke.cjs "$exe" upgrade
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep -Seconds 3
            $restarted = Get-Process -Name 'WinOptimizer Aion' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          } while (-not $restarted -and (Get-Date) -lt $deadline)
          if (-not $restarted) { throw 'Application did not restart after update' }
          if (-not $restarted.CloseMainWindow()) { throw 'Could not close restarted app normally' }
          if (-not $restarted.WaitForExit(60000)) { throw 'Restarted app did not close' }
          $env:AION_EVIDENCE = Join-Path $pwd 'work/native-evidence/upgrade'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke','verify' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Native upgrade verification failed' }
          if (-not (Test-Path "$env:AION_EVIDENCE/verified-verify.json")) { throw 'Native upgrade receipt missing' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-update-evidence
          path: |
            work/native-*.json
            work/screenshots/
            work/native-evidence/
