name: Windows application
on:
  push:
    branches: [main, 'forge/**']
    paths-ignore:
      - 'release-metadata/**'
      - 'docs/**'
      - 'FORGE.md'
      - 'README.md'
      - 'scripts/backup.py'
      - 'scripts/publish-release.cjs'
      - '.github/workflows/publish.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Capture requested application version
        shell: pwsh
        run: '"BUILD_TARGET=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Prepare real baseline version
        run: npm version 5.0.0-beta.1 --no-git-tag-version --allow-same-version
      - run: npm run check
      - name: PowerShell 5.1 real Windows integration
        shell: powershell
        run: .\tests\windows-backend.ps1
      - name: Real Microsoft runtime download and installation
        run: node scripts/windows-runtime-smoke.cjs
      - name: Browser integration
        run: |
          npx playwright install chromium
          npm run test:e2e
      - name: Build baseline installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Install baseline package
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/*-Setup.exe | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
      - name: Installed application real user flow
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\WinOptimizer Aion\WinOptimizer Aion.exe'
          node scripts/windows-smoke.cjs "$exe" seed
      - name: Build next real package
        run: |
          npm version $env:BUILD_TARGET --no-git-tag-version --allow-same-version
          npm run dist:win
      - name: Launch actual portable package and verify local data
        shell: pwsh
        run: node scripts/windows-portable-smoke.cjs "release/WinOptimizer-Aion-${{ env.BUILD_TARGET }}-Windows-x64-Portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*-Setup.exe
            release/*-Portable.exe
            work/native-seed.json
            work/native-diagnostics.json
            work/native-runtime.json
            work/screenshots/
          if-no-files-found: error
