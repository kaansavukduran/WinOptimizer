name: Windows application
on:
  push:
    branches: [main, 'forge/**']
    paths-ignore: ['release-metadata/**', 'docs/**', 'FORGE.md', 'README.md', 'scripts/backup.py', 'scripts/publish-release.cjs', '.github/workflows/publish.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: native/requirements.txt
      - run: npm ci
      - run: python -m pip install -r native/requirements.txt pytest==8.3.5
      - name: Backend and native Qt interface tests
        run: |
          npm test
          python -m pytest -q tests/native
      - name: Real Windows PowerShell inventory, recovery and progress protocol
        shell: powershell
        run: .\tests\windows-backend.ps1
      - name: Real Microsoft runtime download and installation
        run: node scripts/windows-runtime-smoke.cjs
      - name: Install NSIS packaging tool
        run: choco install nsis -y --no-progress
      - name: Build native Setup and Portable packages
        run: python scripts/build-native.py
      - name: Install and exercise actual native app
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/*-Setup.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Native Setup failed' }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\WinOptimizer Aion\WinOptimizer Aion.exe'
          $env:AION_EVIDENCE = Join-Path $pwd 'work/native-evidence/installed'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke','seed' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Native installed UI self-test failed' }
          if (-not (Test-Path "$env:AION_EVIDENCE/verified-seed.json")) { throw 'Native evidence missing' }
      - name: Installer waits for a locked executable and replaces the exact payload
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/*-Setup.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/*-Portable.exe | Select-Object -First 1).FullName
          $exe = Join-Path $env:LOCALAPPDATA 'Programs/WinOptimizer Aion/WinOptimizer Aion.exe'
          $stage = Join-Path (Split-Path $exe) 'WinOptimizer Aion.installing.exe'
          $expected = Get-FileHash $portable -Algorithm SHA256
          $lock = [IO.File]::Open($exe,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
          try {
            $p = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              $staged = (Test-Path $stage) -and (Get-Item $stage).Length -eq (Get-Item $portable).Length
              $p.Refresh()
            } while (-not $staged -and -not $p.HasExited -and (Get-Date) -lt $deadline)
            if (-not $staged) { throw 'Installer did not prepare the complete new payload' }
            Start-Sleep -Seconds 2
            $p.Refresh()
            if ($p.HasExited) { throw 'Installer reported completion while the executable was still locked' }
          } finally { $lock.Dispose() }
          if (-not $p.WaitForExit(120000) -or $p.ExitCode -ne 0) { throw 'Installer replacement failed after releasing the lock' }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $expected.Hash) { throw 'Installed executable is not the verified portable payload' }
          if (Test-Path $stage) { throw 'Installer left an uncommitted staging payload' }
          @{lockedReplacement=$true;sha256=$expected.Hash;bytes=(Get-Item $exe).Length} | ConvertTo-Json | Set-Content 'work/native-evidence/locked-replacement.json' -Encoding utf8
      - name: Portable launch, real scan, reopen and installed-data isolation
        shell: pwsh
        run: |
          $settings = Join-Path $env:LOCALAPPDATA 'WinOptimizer Aion/settings.json'
          $before = (Get-FileHash $settings).Hash
          $exe = (Get-ChildItem release/*-Portable.exe | Select-Object -First 1).FullName
          $env:AION_EVIDENCE = Join-Path $pwd 'work/native-evidence/portable'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke','portable' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Native portable UI self-test failed' }
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke','reopen' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Portable reopening failed' }
          if ((Get-FileHash $settings).Hash -ne $before) { throw 'Portable changed installed settings' }
          if (-not (Test-Path 'release/Data/WinOptimizer Aion/settings.json')) { throw 'Portable Data missing' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installers
          path: |
            release/*-Setup.exe
            release/*-Portable.exe
            work/native-evidence/
          if-no-files-found: error
